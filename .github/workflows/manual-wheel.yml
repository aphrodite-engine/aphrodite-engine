name: Build wheel

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  wheel:
    runs-on: [self-hosted, linux, x64, aphrodite-wheel-builder]
    timeout-minutes: 720
    env:
      DOCKER_HOST: tcp://127.0.0.1:23750
      RCLONE_CONFIG_B2_TYPE: s3
      RCLONE_CONFIG_B2_PROVIDER: Other
      RCLONE_CONFIG_B2_ACCESS_KEY_ID: ${{ secrets.B2_S3_KEY_ID }}
      RCLONE_CONFIG_B2_SECRET_ACCESS_KEY: ${{ secrets.B2_S3_APPLICATION_KEY }}
      RCLONE_CONFIG_B2_REGION: ${{ vars.B2_S3_REGION }}
      RCLONE_CONFIG_B2_ENDPOINT: ${{ vars.B2_S3_ENDPOINT }}
      RCLONE_CONFIG_B2_NO_CHECK_BUCKET: "true"
      B2_S3_BUCKET: ${{ vars.B2_S3_BUCKET }}
      B2_PUBLIC_BASE_URL: ${{ vars.B2_PUBLIC_BASE_URL }}
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install rclone
        run: |
          ./.github/scripts/install-rclone.sh "$RUNNER_TEMP/rclone-bin"
          echo "$RUNNER_TEMP/rclone-bin" >> "$GITHUB_PATH"

      - name: Validate nightly storage
        shell: bash
        run: |
          set -euo pipefail
          : "${RCLONE_CONFIG_B2_ACCESS_KEY_ID:?B2_S3_KEY_ID secret is not configured}"
          : "${RCLONE_CONFIG_B2_SECRET_ACCESS_KEY:?B2_S3_APPLICATION_KEY secret is not configured}"
          : "${RCLONE_CONFIG_B2_REGION:?B2_S3_REGION variable is not configured}"
          : "${RCLONE_CONFIG_B2_ENDPOINT:?B2_S3_ENDPOINT variable is not configured}"
          : "${B2_S3_BUCKET:?B2_S3_BUCKET variable is not configured}"
          : "${B2_PUBLIC_BASE_URL:?B2_PUBLIC_BASE_URL variable is not configured}"

          test_object="_ci/preflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          remote="b2:${B2_S3_BUCKET}/${test_object}"
          trap '"$RUNNER_TEMP/rclone-bin/rclone" deletefile "$remote" >/dev/null 2>&1 || true' EXIT

          printf 'nightly storage preflight\n' |
            "$RUNNER_TEMP/rclone-bin/rclone" rcat "$remote"
          "$RUNNER_TEMP/rclone-bin/rclone" cat "$remote" >/dev/null
          public_test_url="${B2_PUBLIC_BASE_URL%/}/${test_object}"
          test "$(curl --fail --silent --show-error --location \
            --retry 10 \
            --retry-all-errors \
            --retry-delay 3 \
            "$public_test_url")" = "nightly storage preflight"

      - name: Compute wheel version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*')"
          release="${tag#v}"
          IFS=. read -r major minor patch <<< "$release"
          version="${major}.${minor}.$((patch + 1)).dev$(date -u +%Y%m%d%H%M)+cu130.g$(git rev-parse --short=9 HEAD)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building ${version} from $(git rev-parse HEAD)"

      - name: Build CUDA wheel
        env:
          APHRODITE_VERSION_OVERRIDE: ${{ steps.version.outputs.version }}
          MAX_JOBS: "64"
          NVCC_THREADS: "4"
          CUDA_VERSION: "13.0.2"
          TORCH_CUDA_ARCH_LIST: "8.0 8.6 8.9 9.0 10.0 12.0+PTX"
        run: ./docker/export_wheels.sh

      - name: Upload wheel and generate package index
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find wheels/main -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          wheel_name="$(basename "$wheel")"
          remote="b2:${B2_S3_BUCKET}/wheels/${wheel_name}"

          "$RUNNER_TEMP/rclone-bin/rclone" copyto "$wheel" "$remote" \
            --s3-upload-concurrency 8 \
            --s3-chunk-size 64M

          public_wheel_url="${B2_PUBLIC_BASE_URL%/}/wheels/${wheel_name}"
          curl --fail --silent --show-error --location \
            --retry 10 \
            --retry-all-errors \
            --retry-delay 3 \
            --range 0-0 \
            --output /dev/null \
            "$public_wheel_url"

          entries="$RUNNER_TEMP/aphrodite-wheel-index.tsv"
          : > "$entries"
          while IFS= read -r stored_wheel; do
            stored_url="${B2_PUBLIC_BASE_URL%/}/wheels/${stored_wheel}"
            if [[ "$stored_wheel" == "$wheel_name" ]]; then
              digest="$(sha256sum "$wheel" | cut -d ' ' -f 1)"
              printf '%s\t%s\t%s\n' \
                "$stored_wheel" "$stored_url" "$digest" >> "$entries"
            else
              printf '%s\t%s\n' "$stored_wheel" "$stored_url" >> "$entries"
            fi
          done < <("$RUNNER_TEMP/rclone-bin/rclone" lsf \
            "b2:${B2_S3_BUCKET}/wheels" --files-only --include '*.whl' |
            sort -r)

          python3 .github/scripts/generate_nightly_index.py \
            --entry-file "$entries" \
            --commit "$(git rev-parse HEAD)" \
            --output manual-wheel-index/index.html

      - name: Upload package index
        uses: actions/upload-artifact@v4
        with:
          name: aphrodite-simple-index
          path: manual-wheel-index/index.html
          if-no-files-found: error
          retention-days: 1

  build-pages:
    needs: wheel
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download package index
        uses: actions/download-artifact@v4
        with:
          name: aphrodite-simple-index
          path: docs/public/simple/aphrodite-engine

      - name: Build and upload site
        uses: withastro/action@v3
        with:
          path: ./docs
          node-version: 22
          package-manager: pnpm@9.15.8

  deploy:
    needs: build-pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
